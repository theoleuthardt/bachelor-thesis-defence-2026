# Runs on the Proxmox LXC. Pulls the prebuilt image from GHCR instead of
# building locally - see revealjs-update.sh/.service/.timer alongside this
# file for how the image gets refreshed automatically.
services:
  revealjs:
    image: ghcr.io/theoleuthardt/bachelor-thesis-defence-2026:${IMAGE_TAG:-latest}
    container_name: revealjs-presentation
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
